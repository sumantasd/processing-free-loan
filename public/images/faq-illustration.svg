<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%">
  <defs>
    <linearGradient id="faqBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677FF" />
      <stop offset="100%" stop-color="#0866E8" />
    </linearGradient>
    <linearGradient id="faqCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="faqGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12C878" />
      <stop offset="100%" stop-color="#0FA863" />
    </linearGradient>
    <filter id="faqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#062B59" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Large Primary Blue Bubble -->
  <g transform="translate(60, 60)" filter="url(#faqShadow)">
    <path d="M 40 0 C 18 0 0 18 0 40 L 0 140 C 0 162 18 180 40 180 L 110 180 L 140 220 L 145 180 L 180 180 C 202 180 220 162 220 140 L 220 40 C 220 18 202 0 180 0 Z" fill="url(#faqBlue)" />
    <!-- Big Question Mark -->
    <text x="110" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="110" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text>
  </g>

  <!-- Secondary Soft Blue Bubble -->
  <g transform="translate(230, 140)" filter="url(#faqShadow)">
    <path d="M 30 0 C 14 0 0 14 0 30 L 0 100 C 0 116 14 130 30 130 L 70 130 L 90 160 L 95 130 L 130 130 C 146 130 160 116 160 100 L 160 30 C 160 14 146 0 130 0 Z" fill="url(#faqCyan)" />
    <text x="80" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text>
  </g>

  <!-- Small Accent Green Badge -->
  <g transform="translate(90, 270)" filter="url(#faqShadow)">
    <circle cx="36" cy="36" r="36" fill="url(#faqGreen)" />
    <text x="36" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text>
  </g>

  <!-- Floating spark/star -->
  <path d="M 360 80 Q 365 95 380 100 Q 365 105 360 120 Q 355 105 340 100 Q 355 95 360 80 Z" fill="#12C878" opacity="0.8" />
  <circle cx="50" cy="200" r="8" fill="#1677FF" opacity="0.3" />
</svg>
